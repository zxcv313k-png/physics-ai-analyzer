name: Import project ZIP

on:
  push:
    paths:
      - "*.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Unpack project
        shell: bash
        run: |
          set -e

          zip_file="$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)"

          test -n "$zip_file"

          rm -rf .imported
          mkdir .imported

          unzip -q "$zip_file" -d .imported

          shopt -s dotglob

          entries=(.imported/*)

          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            src="${entries[0]}"
          else
            src=".imported"
          fi

          cp -a "$src"/. .

          rm -rf .imported "$zip_file"

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git diff --cached --quiet || git commit -m "Import physics AI analyzer project"

          git push
